name: Update GitHub Stack

on:
  push:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate stack
        uses: githubocto/flat@v3
        with:
          src: https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100
          downloaded_filename: repos.json

      - name: Update README
        run: |
          echo "Updating stack..."
